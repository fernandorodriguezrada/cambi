<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo Squircle Blanco con Borde Nítido -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="#ffffff" stroke="#d5dce5" stroke-width="2.5"/>
  
  <!-- Marca "SUICHE" -->
  <text x="50" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="900" fill="#0c2340" letter-spacing="1.8">SUICHE</text>
  
  <!-- Círculo Central 7B -->
  <g transform="translate(50, 61)">
    <!-- 4 Arcos / Cuadrantes Oficiales de Suiche 7B -->
    <!-- Magenta (Arriba Izquierda) -->
    <path d="M 0 0 L -27 0 A 27 27 0 0 1 0 -27 Z" fill="#b60e80"/>
    <!-- Azul Interbancario (Arriba Derecha) -->
    <path d="M 0 0 L 0 -27 A 27 27 0 0 1 27 0 Z" fill="#005e9c"/>
    <!-- Verde Red (Abajo Derecha) -->
    <path d="M 0 0 L 27 0 A 27 27 0 0 1 0 27 Z" fill="#2e7d32"/>
    <!-- Dorado / Amarillo (Abajo Izquierda) -->
    <path d="M 0 0 L 0 27 A 27 27 0 0 1 -27 0 Z" fill="#fbb201"/>
    
    <!-- Anillo separador interior blanco sutil -->
    <circle cx="0" cy="0" r="22.5" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
    
    <!-- Emblema 7B en Blanco -->
    <text x="0" y="8.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="-0.5" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.6));">7B</text>
  </g>
</svg>
